name: Deploy to ConoHa Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: advanced/006/package-lock.json

      - name: Install dependencies
        working-directory: advanced/006
        run: npm ci

      - name: Build Next.js
        working-directory: advanced/006
        run: npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp -r beginner _deploy/
          cp -r elementary _deploy/
          cp -r intermediate _deploy/
          cp -r advanced _deploy/
          rm -rf _deploy/advanced/006
          cp -r advanced/006/out _deploy/advanced/006

      - name: Deploy via SSH
        env:
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${REMOTE_PORT}" -H "${REMOTE_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          DEST=$(echo "${REMOTE_PATH}" | tr -d '[:space:]')
          PORT=$(echo "${REMOTE_PORT}" | tr -d '[:space:]')
          REMOTE="${REMOTE_USER}@${REMOTE_HOST}"
          ssh -p "${PORT}" "${REMOTE}" "mkdir -p ${DEST}"
          rsync -az -e "ssh -p ${PORT}" ./_deploy/ "${REMOTE}:${DEST}/"
